name: Bug report
description: Something in the panel misbehaves
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not report a security vulnerability here - use
        [private reporting](https://github.com/yoava/obsidian-ai-agent-panel/security/advisories/new)
        instead. See [SECURITY.md](https://github.com/yoava/obsidian-ai-agent-panel/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
      placeholder: |
        1. Opened the panel in a vault with ...
        2. Sent "..."
        3. Expected ..., but ...
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: Settings - Community plugins - AI Agent Panel, or the `version` in the plugin's manifest.json.
      placeholder: "0.3.2"
    validations:
      required: true

  - type: input
    id: obsidian-version
    attributes:
      label: Obsidian version
      description: Help - About, or Settings - About.
      placeholder: "1.5.0"
    validations:
      required: true

  - type: input
    id: cli-version
    attributes:
      label: Claude Code version
      description: Output of `claude --version`.
      placeholder: "2.1.210"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows (native install)
        - Windows (WSL install)
        - Linux
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Console output
      description: |
        Any errors from Obsidian's developer console (Ctrl/Cmd-Shift-I - Console).
        Review before pasting - console output can contain note content and file paths.
      render: text
    validations:
      required: false
