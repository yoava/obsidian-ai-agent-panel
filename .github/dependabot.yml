version: 2

updates:
  # Workflow actions are pinned to commit SHAs (see docs/current/SECURITY.md), which is
  # only safe if something keeps the pins current. Dependabot rewrites both the
  # SHA and the trailing version comment.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        # Majors are excluded from the group deliberately, so each one arrives
        # as its own pull request with its own CI run rather than hiding
        # inside a batch.
        update-types: ["minor", "patch"]
    commit-message:
      prefix: ci
    open-pull-requests-limit: 3

  # One npm entry (Dependabot rejects two for the same directory). Runtime
  # packages (what main.js bundles: the two fonts, ADR-007 and ADR-017) are
  # outside any group, so each arrives as its own pull request and re-runs the
  # dependency screen's security and legal rows, the 7-day rule, the notices
  # and the size change. The build toolchain, which never reaches a vault, is
  # one grouped pull request. Weekly, so a runtime update is seen within a week.
  # Ranges in package.json are updated too: runtime packages and obsidian are
  # pinned exactly, and a lockfile-only update could never move a pin.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
        # Majors stay out of the group, each its own pull request: the first
        # grouped run bundled four majors including typescript 5 -> 7, which
        # fails the build outright.
        update-types: ["minor", "patch"]
    commit-message:
      prefix: build
    open-pull-requests-limit: 5
    ignore:
      # Pinned exactly (1.13.1): the API typings follow the Obsidian app, not
      # semver, so the owner moves the pin deliberately.
      - dependency-name: obsidian
