name: Release

on:
  push:
    tags: ["*"]

permissions:
  contents: write
  # Provenance attestations: id-token to get the OIDC token that identifies this
  # workflow run, attestations to record the signed statement on the repository.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install the reviewed lockfile without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Run the complete repository gate (build, docs, lint, tests)
        run: make verify
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Create draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --draft \
            main.js manifest.json styles.css
