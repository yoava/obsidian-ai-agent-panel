<!doctype html>
<html lang="en">
<head>

<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.app{--bg:#141417;--bg-2:#18181c;--surface:#1d1d22;--surface-2:#26262c;--surface-3:#2f2f36;--line:rgba(255,255,255,.07);--line-2:rgba(255,255,255,.12);--text:#ededf0;--muted:#a6a6b0;--faint:#8c8c96;--user-bg:#2a241c;--user-line:rgba(245,180,90,.36);--green:#4fc58c;--red:#f2706f;--orange:#f5a04a;--red-soft:rgba(242,112,111,.13);--shadow:0 18px 40px rgba(0,0,0,.45),0 2px 8px rgba(0,0,0,.3);--accent:#a99cfa;--accent-fill:#6d5ce7;--accent-soft:rgba(139,124,246,.15);--accent-line:rgba(139,124,246,.5);color-scheme:dark;font-family:'Geist',system-ui,-apple-system,sans-serif;font-size:13.5px;line-height:1.5;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;box-sizing:border-box;position:relative}
.app.t-light{--bg:#fbfbfa;--bg-2:#f4f4f2;--surface:#ffffff;--surface-2:#f0f0ed;--surface-3:#e6e6e2;--line:rgba(24,24,32,.08);--line-2:rgba(24,24,32,.14);--text:#1b1b20;--muted:#53535d;--faint:#696973;--user-bg:#fdf3e4;--user-line:#ecca95;--green:#16864f;--red:#cc3b3a;--orange:#b8620a;--red-soft:rgba(204,59,58,.08);--shadow:0 18px 40px rgba(24,24,48,.10),0 2px 8px rgba(24,24,48,.06);--accent:#5847d4;--accent-fill:#6352e0;--accent-soft:rgba(99,82,224,.09);--accent-line:rgba(99,82,224,.4);color-scheme:light}
.app.acc-blue{--accent:#82aeff;--accent-fill:#2f6fe0;--accent-soft:rgba(80,140,255,.15);--accent-line:rgba(80,140,255,.5)}
.app.t-light.acc-blue{--accent:#1d5cc9;--accent-fill:#2463d6;--accent-soft:rgba(36,99,214,.09);--accent-line:rgba(36,99,214,.4)}
.app.acc-teal{--accent:#5fd4c6;--accent-fill:#0f7c74;--accent-soft:rgba(60,200,185,.14);--accent-line:rgba(60,200,185,.5)}
.app.t-light.acc-teal{--accent:#0b6c65;--accent-fill:#0e7a72;--accent-soft:rgba(14,122,114,.09);--accent-line:rgba(14,122,114,.4)}
.app{--strip:#222227}.app.t-light{--strip:#ebebe7}
.app *{box-sizing:border-box}
:where(.app button,.app input,.app textarea){font:inherit;color:inherit;background:none;border:0;margin:0;padding:0}
:where(.app button){cursor:pointer}
.i{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.i12{width:12px;height:12px}.i16{width:16px;height:16px}
.mono{font-family:'Geist Mono',ui-monospace,SFMono-Regular,monospace;font-size:.92em}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ib{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:8px;color:var(--muted);flex:none}
.ib:hover{background:var(--surface-2);color:var(--text)}
.tab{display:flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:9px 9px 0 0;font-size:12.5px;color:var(--muted);white-space:nowrap;min-width:0;position:relative;flex:0 1 auto}
.tab:hover{background:var(--line-2);color:var(--text)}
.tab + .tab::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:1px;background:var(--line-2)}
.tab.on + .tab::before,.tab:not(.on):hover::before,.tab:not(.on):hover + .tab::before{display:none}
.tab.on{background:var(--bg);color:var(--text);font-weight:600;z-index:1}
.tab.on::before,.tab.on::after{content:"";position:absolute;top:auto;bottom:0;width:9px;height:9px;background:radial-gradient(circle at 0 0,transparent 8.5px,var(--bg) 9px)}
.tab.on::before{left:-9px}
.tab.on::after{right:-9px;background:radial-gradient(circle at 100% 0,transparent 8.5px,var(--bg) 9px)}
.dot{width:6px;height:6px;border-radius:50%;flex:none}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);font-size:12px;white-space:nowrap;max-width:100%}
.seg{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 8px;border-radius:7px;color:var(--muted);font-size:12px;white-space:nowrap}
.seg:hover{background:var(--surface-2);color:var(--text)}
.starter{display:flex;align-items:center;gap:10px;width:100%;height:42px;padding:0 12px 0 10px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:13px;color:var(--text);text-align:left}
.starter:hover{border-color:var(--line-2);background:var(--surface-2)}
.tile{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:7px;background:var(--surface-2);color:var(--muted);flex:none}
.sug{display:flex;align-items:center;gap:10px;width:100%;height:38px;padding:0 10px;border-radius:8px;text-align:left;font-size:13px}
.sug:hover{background:var(--surface-2)}
.sug.on{background:var(--accent-soft)}
.lbl{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 4px;border-radius:5px;background:var(--surface-2);box-shadow:inset 0 -1px 0 var(--line-2);font-size:10.5px;color:var(--muted);font-family:'Geist Mono',ui-monospace,monospace}
.ta{width:100%;resize:none;outline:none;font-size:13.5px;line-height:1.5;color:var(--text);display:block}
.ta::placeholder{color:var(--faint)}
</style>
</helmet>
<div class="app {{mods}}" style="width:440px;height:960px;display:flex;flex-direction:column;overflow:hidden;border-left:1px solid var(--line)">

  <header style="display:flex;align-items:center;gap:4px;padding:6px 8px 0 10px;border-bottom:1px solid var(--line-2);background:var(--strip)">

      <button class="tab" style="max-width:124px"><span class="dot" style="background:var(--accent);animation:pulse 1.4s ease-in-out infinite"></span><span class="ell">Q4 planning review</span></button>
      <button class="tab on" style="max-width:150px"><span class="ell">New conversation</span></button>
    </nav>
    <button class="ib" aria-label="New conversation"><svg class="i i16" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></button>
    <span style="width:1px;height:16px;background:var(--line-2);margin:0 3px;flex:none"></span>
    <button class="ib" aria-label="Previous conversations"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path><path d="M12 7v5l4 2"></path></svg></button>
    <button class="ib" aria-label="Plugin settings"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
  </header>

  <main style="flex:1;min-height:0;overflow:hidden;padding:0 28px 250px 28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0">
    <span style="width:52px;height:52px;border-radius:15px;background:var(--accent-soft);color:var(--accent);display:inline-flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px var(--accent-line)"><svg class="i" style="width:26px;height:26px;stroke-width:1.6" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path><path d="m7.5 8 2.5 2.5L7.5 13"></path><path d="M12.5 13h4"></path></svg></span>
    <h1 style="margin:18px 0 6px 0;font-size:20px;font-weight:600;letter-spacing:-.01em">Ask about your vault</h1>
    <p style="margin:0;max-width:300px;text-align:center;color:var(--muted);font-size:13px;line-height:1.55">Summarize, refactor, link or draft notes. Claude reads and edits files only with your permission.</p>

    <div style="width:100%;max-width:340px;margin-top:26px;display:flex;flex-direction:column;gap:6px">
      <span class="lbl" style="padding:0 2px 4px 2px">From the open note</span>
      <button class="starter">
        <span class="tile"><svg class="i i12" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"></path><path d="M14 2v4a2 2 0 0 0 2 2h4"></path><path d="M16 13H8"></path><path d="M16 17H8"></path></svg></span>
        <span class="ell" style="flex:1">Summarize <span style="font-weight:500">Q4 planning.md</span></span>
        <svg class="i i12" style="color:var(--faint)" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
      </button>
      <button class="starter">
        <span class="tile"><svg class="i i12" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg></span>
        <span class="ell" style="flex:1">Find notes that should link here</span>
        <svg class="i i12" style="color:var(--faint)" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
      </button>
      <button class="starter">
        <span class="tile"><svg class="i i12" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span>
        <span class="ell" style="flex:1">Draft a follow-up from the selection</span>
        <svg class="i i12" style="color:var(--faint)" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
      </button>
    </div>
  </main>

  <div style="padding:6px 12px 10px 12px;display:flex;flex-direction:column;gap:6px;position:relative">

    <div role="listbox" aria-label="Files matching hir" style="position:absolute;left:12px;right:12px;bottom:calc(100% - 2px);background:var(--surface);border:1px solid var(--line-2);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;gap:1px">
      <span class="lbl" style="padding:4px 8px 6px 8px">Files</span>
      <button role="option" aria-selected="true" class="sug on">
        <svg class="i" style="color:var(--accent)" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"></path><path d="M14 2v4a2 2 0 0 0 2 2h4"></path></svg>
        <span style="flex:none"><span style="font-weight:600">Hir</span>ing plan.md</span>
        <span class="mono ell" style="flex:1;font-size:11px;color:var(--faint)">Projects/</span>
        <span class="kbd">↵</span>
      </button>
      <button role="option" aria-selected="false" class="sug">
        <svg class="i" style="color:var(--muted)" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"></path><path d="M14 2v4a2 2 0 0 0 2 2h4"></path></svg>
        <span style="flex:none"><span style="font-weight:600">Hir</span>ing pipeline.md</span>
        <span class="mono ell" style="flex:1;font-size:11px;color:var(--faint)">Areas/People/</span>
      </button>
      <button role="option" aria-selected="false" class="sug">
        <svg class="i" style="color:var(--muted)" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"></path><path d="M14 2v4a2 2 0 0 0 2 2h4"></path></svg>
        <span style="flex:none"><span style="font-weight:600">Hir</span>ing retro 2025.md</span>
        <span class="mono ell" style="flex:1;font-size:11px;color:var(--faint)">Archive/2025/</span>
      </button>
      <button role="option" aria-selected="false" class="sug">
        <svg class="i" style="color:var(--muted)" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"></path></svg>
        <span style="flex:none"><span style="font-weight:600">Hir</span>ing/</span>
        <span class="mono ell" style="flex:1;font-size:11px;color:var(--faint)">Areas/People/</span>
      </button>
      <div style="display:flex;align-items:center;gap:10px;margin-top:4px;padding:7px 8px 2px 8px;border-top:1px solid var(--line);font-size:11px;color:var(--faint)">
        <span style="display:inline-flex;align-items:center;gap:4px"><span class="kbd">↑</span><span class="kbd">↓</span>navigate</span>
        <span style="display:inline-flex;align-items:center;gap:4px"><span class="kbd">↵</span>attach</span>
        <span style="display:inline-flex;align-items:center;gap:4px"><span class="kbd">esc</span>close</span>
      </div>
    </div>

    <div style="background:var(--surface);border:1px solid var(--accent-line);border-radius:14px;box-shadow:0 0 0 3px var(--accent-soft),var(--shadow);padding:10px 8px 8px 12px;display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="chip" style="background:var(--accent-soft);color:var(--accent)" aria-label="Active note is attached - click to exclude">
          <svg class="i i12" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"></path><path d="M14 2v4a2 2 0 0 0 2 2h4"></path></svg>
          Q4 planning.md
        </button>
        <button class="chip" style="background:transparent;box-shadow:inset 0 0 0 1px var(--line-2);color:var(--faint)" aria-label="Click to attach the active folder">
          <svg class="i i12" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>
          Planning/
        </button>
      </div>
      <textarea class="ta" rows="2" aria-label="Message">Compare the hiring section with @hir</textarea>
      <div style="display:flex;align-items:center;gap:2px">
        <button class="ib" aria-label="Attach a file as context"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg></button>
        <button class="ib" aria-label="Show commands"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="m9 15 6-6"></path></svg></button>
        <span style="flex:1"></span>
        <button aria-label="Send" style="width:30px;height:30px;border-radius:9px;background:var(--accent-fill);color:#fff;display:inline-flex;align-items:center;justify-content:center"><svg class="i i16" style="stroke-width:2.2" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 7-7 7 7"></path><path d="M12 19V5"></path></svg></button>
      </div>
    </div>
    <div style="display:flex;align-items:center;padding:0 2px">
      <button class="seg" aria-label="Model" style="color:var(--text)"><svg class="i i12" style="color:var(--accent)" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"></path></svg>Opus 5.5</button>
      <button class="seg" aria-label="Reasoning effort"><svg class="i i12" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 14 4-4"></path><path d="M3.34 19a10 10 0 1 1 17.32 0"></path></svg>Medium</button>
      <button class="seg" aria-label="Permissions"><svg class="i i12" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"></path></svg>Ask</button>
      <span style="flex:1"></span>
      <button class="seg" aria-label="Plan usage"><span>5h</span><span class="mono" style="color:var(--text)">42%</span><span style="color:var(--faint)">·</span><span>wk</span><span class="mono" style="color:var(--text)">18%</span></button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"accent":{"editor":"enum","options":["violet","blue","teal"],"default":"violet"},"$preview":{"width":440,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme ?? 'dark';
    const accent = this.props.accent ?? 'violet';
    return { mods: 't-' + theme + ' acc-' + accent };
  }
}
</script>
</body>
