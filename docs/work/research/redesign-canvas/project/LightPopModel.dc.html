<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Model and effort popover (light)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<dc-import name="PopModel" theme="light" accent="{{accent}}" hint-size="440px,600px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"enum","options":["violet","blue","teal"],"default":"violet"},"$preview":{"width":440,"height":600}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? 'violet' };
  }
}
</script>
</body>
</html>
